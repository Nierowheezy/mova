# Deploy the backend to Render on every push to main.
#
# Two supported paths (pick one, they do the same thing):
#   A. Native Render GitHub integration: connect the repo in the Render
#      Dashboard and Render auto-deploys on push (used by the Blueprint).
#   B. This workflow: POSTs to a Render Deploy Hook. Create one at
#      Dashboard -> mova-api -> Manual Deploys -> Deploy Hook, then store the
#      URL as the RENDER_DEPLOY_HOOK_URL Github Action secret.
#
# The workflow is a no-op when the secret is not configured, so CI keeps
# passing even before the dashboard hook exists.

name: Deploy Backend (Render)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Skip notice (no hook configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL not set - skipping. Render auto-deploy (GitHub integration) may be in use."