# Deploy the frontend to Vercel on every push to main.
#
# Prerequisites (set once):
#   1. Create a Vercel project from this repo (root directory: frontend).
#   2. Store these repository secrets:
#        VERCEL_TOKEN       - Vercel account token (Settings -> Tokens)
#        VERCEL_ORG_ID      - your Vercel team/user id
#        VERCEL_PROJECT_ID  - the project id (Settings -> General)
#   3. Set the build-time env vars on the Vercel project:
#        VITE_API_URL                   -> https://mova-api.onrender.com/api/v1/ (or your Render URL + /api/v1/)
#        VITE_FRONTEND_URL              -> your Vercel deployment URL
#        VITE_STRIPE_PUBLISHABLE_KEY    -> pk_live_... for production
#
# Alternative: connect the GitHub repo natively in Vercel (Import Project)
# and skip this workflow entirely.

name: Deploy Frontend (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: --prod